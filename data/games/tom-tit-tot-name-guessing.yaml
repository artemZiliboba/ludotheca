    observed_play:
      - Маленькое существо предлагает каждый день прясть за героиню пять мотков пряжи в обмен на право забирать её, если она не угадает его имя до конца месяца.
      - В первый вечер героиня пробует имена Билл, Нед и Марк; существо отвергает все три ответа.
      - В предпоследний вечер героиня снова называет три неверных имени; существо предупреждает, что остался один вечер.
      - Король случайно слышит, как существо поёт собственное имя у мелового карьера, и пересказывает услышанное жене.
      - В последний вечер героиня называет два неправильных имени, затем с третьей попытки произносит «Tom Tit Tot»; существо вскрикивает и улетает.
    explicit_rules:
      - Существо прямо разрешает героине по три попытки угадать его имя каждый вечер.
      - Если имя не будет угадано до конца месяца, героиня должна перейти во власть существа.
    mechanics:
      - Повторяющиеся вечерние раунды по три устных предположения с немедленным подтверждением или отрицанием каждого имени.
      - Ограничение по времени — один месяц; победа достигается точным называнием скрытого имени.
      - Получение правильного ответа от третьего лица показано как сюжетный способ решения задачи; запрет на подсказки в тексте не установлен.
    completeness: partial
