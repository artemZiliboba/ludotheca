    observed_play:
      - Джим Смайли в течение трёх месяцев учит лягушку Дэниела Вебстера прыгать и затем предлагает незнакомцу пари на сорок долларов, утверждая, что его лягушка перепрыгнет любую другую в округе.
      - Незнакомец соглашается при условии, что ему дадут другую лягушку; Смайли отправляется за ней, оставляя своего Дэниела Вебстера у соперника.
      - Пока Смайли отсутствует, незнакомец незаметно засыпает Дэниелу Вебстеру в рот охотничью дробь.
      - Смайли ставит двух лягушек рядом, выравнивает их передние лапы и подаёт счёт до трёх как сигнал; оба участника подталкивают лягушек сзади.
      - Лягушка незнакомца прыгает, а Дэниел Вебстер не может сдвинуться; незнакомец забирает деньги.
      - После ухода соперника Смайли обнаруживает дробь, когда переворачивает свою лягушку, и пытается догнать мошенника.
    explicit_rules:
      - Смайли предлагает определить победителя по тому, чья лягушка прыгнет дальше, и ставит на исход сорок долларов.
    mechanics:
      - Две лягушки размещаются рядом с выровненными передними лапами; старт задаётся общим счётом и лёгким подталкиванием.
      - Результат в показанном пари определяется сравнением дальности прыжка.
      - Тайное утяжеление одной лягушки дробью влияет на исход состязания, но не является разрешённым правилом.
