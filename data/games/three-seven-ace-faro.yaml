    observed_play:
      - Призрак графини называет Германну последовательность карт — тройка, семёрка, туз — и обещает выигрыш при соблюдении оговорённых условий.
      - В игре против Чекалинского Германн сначала ставит на тройку и выигрывает; на следующий вечер ставит на семёрку и снова выигрывает.
      - На третий вечер Германн рассчитывает на туза, но в его руках оказывается пиковая дама, и ставка проигрывает.
      - Банкомёт принимает ставки, тасует и сдаёт карты; на третьем вечере Германн снимает карту после тасовки банкомёта.
    explicit_rules:
      - В речи призрака графини предписано разыгрывать тройку, семёрку и туза по очереди, не более одной карты за двадцать четыре часа, а затем никогда больше не играть; это условие сверхъестественного обещания, а не общее правило фараона.
      - Чекалинский требует ставить наличные деньги на карту, ссылаясь на правила игры.
    mechanics:
      - Ставка на выбранное достоинство карты против банкомёта; выигрыш или проигрыш определяется вскрытыми картами.
      - Последовательность ставок на тройку, семёрку и туза составляет сюжетную особенность партии Германна, а не стандартную механику фараона.
    distinctive_features:
      - Сверхъестественное обещание гарантированного выигрыша на трёх названных картах при ограничении частоты игры и запрете на дальнейшие ставки.
      - В последней партии ожидаемый туз оборачивается пиковой дамой и проигрышем.
