    observed_play:
      - Принцесса объявляет, что желающий жениться на ней должен загадать ей загадку; до появления героя девять претендентов погибают после успешного разгадывания их загадок принцессой.
      - Королевич загадывает загадку о том, как один никого не убил, но всё же убил двенадцать; принцесса не может найти разгадку даже в книгах.
      - В первую и вторую ночь принцесса посылает служанок подслушать ответ; слуга королевича прогоняет их и забирает плащи.
      - В третью ночь принцесса сама выспрашивает ответ у бодрствующего королевича, думая, что тот спит; он объясняет историю отравленного ворона и двенадцати разбойников.
      - Наутро принцесса объявляет разгадку перед двенадцатью судьями, но королевич предъявляет плащи как доказательство того, что ответ был добыт подслушиванием; судьи принимают решение о свадьбе.
    explicit_rules:
      - Претендент задаёт принцессе загадку, на решение которой ей отводятся три дня.
      - Если принцесса не разгадает загадку, претендент становится её мужем; если разгадает, претендента должны обезглавить.
    mechanics:
      - Асимметричные роли задающего загадку и разгадывающей с ограничением времени на ответ.
      - Противоположные исходы состязания определяются тем, удаётся ли найти разгадку в установленный срок.
      - История показывает получение ответа путём тайного выспрашивания и последующую проверку обстоятельств разгадки судьями; текст не формулирует общего свода правил о допустимости подсказок.
