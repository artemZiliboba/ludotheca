    observed_play:
      - Автор описывает игру для одного или нескольких участников с четырьмя красными и пятью серыми фишками и диаграммой на карточке.
      - На малой диаграмме из четырёх отделений автор помещает красную фишку в клетку, чтобы обозначить существование хотя бы одного объекта с заданными двумя признаками, а серую — отсутствие таких объектов.
      - Если существование объекта известно, но один из двух вариантов размещения не определён, автор помещает красную фишку на разделительную линию между соответствующими клетками.
      - Для силлогизмов автор переносит условия на большую восьмисекторную диаграмму с тремя признаками, затем извлекает информацию о двух признаках и отмечает её на малой диаграмме.
      - Автор демонстрирует, как из условий выводятся заключения и как выявляются случаи, когда заключение не следует из посылок или вывод неполон.
      - Главы II и IV содержат задания на кодирование высказываний, интерпретацию фишек и проверку выводов; глава III содержит ответы.
    explicit_rules:
      - Для игры нужны девять фишек — четыре красные и пять серых; достаточно одного игрока, но автор допускает совместную работу двоих.
      - Красная фишка в отделении означает, что там существует хотя бы один объект; серая означает, что отделение пусто.
      - Фишка на границе двух отделений обозначает наличие объекта в одном из них при неизвестном выборе между ними.
      - В задачах с тремя признаками сначала следует отметить посылки на большой диаграмме, затем перенести следствия для двух признаков на малую и прочитать заключение.
    mechanics:
      - Пространственное кодирование логических отношений и существования объектов цветными фишками.
      - Представление неполной информации положением фишки на границе и уточнение положения при поступлении ограничений.
      - Переход от модели с тремя признаками к модели с двумя признаками через устранение промежуточного термина.
      - Обнаружение недоказуемых, неверных и неполных заключений путём сравнения состояния диаграмм.
    distinctive_features:
      - Игровая доска одновременно выступает вычислительным инструментом для логических выводов.
      - Неопределённость имеет отдельное физическое представление — положение фишки между клетками.
      - Задачи постепенно усложняются от двух признаков до трёх, а готовые ответы вынесены в отдельную главу.
      - Текст не задаёт очков, соревнования на скорость или универсального условия победы; это одиночная либо совместная головоломка.
    completeness: complete
