      edition: 'Robert Louis Stevenson, New Arabian Nights (1895 Charles Scribner’s Sons author’s edition), English text transcribed at Wikisource; originally published in 1878'
    observed_play:
      - Председатель клуба тасует колоду из 52 карт и раздаёт их сидящим за столом участникам в обратном направлении, делая паузу, пока получатель не откроет свою карту.
      - В первую показанную ночь молодой человек с пирожными получает туза треф, а мистер Мальтус — туза пик; остальные показанные карты не назначают им специальных ролей.
      - На следующую ночь карты проходят вокруг стола трижды, а при четвёртой раздаче одному участнику достаётся туз треф, принцу Флоризелю — туз пик.
      - Получивший туза треф должен выполнить распоряжения клуба в отношении обладателя туза пик; во вторую ночь Флоризель получает от председателя указание следовать за этим участником.
      - Полковник Джеральдин организует вмешательство вне правил клуба и спасает принца; это сюжетное нарушение, а не допустимый игровой ход.
    explicit_rules:
      - Используется полная колода из 52 карт; председатель тасует и раздаёт карты, но сам в игре не участвует.
      - Туз пик обозначает назначенного на смерть участника, а туз треф — назначенного исполнителя убийства.
      - Обычный член клуба возвращается на последующие вечера, пока случайный выбор не назначит ему смертельную роль; для Мальтуса описано исключение по частоте посещений.
    mechanics:
      - Последовательная открытая раздача карт с отслеживанием двух особых карт в общей колоде.
      - Случайное асимметричное распределение двух ролей между участниками через туза пик и туза треф.
      - Нарастание неопределённости, пока оба туза не появятся; в рассказе зафиксированы две раздачи с разным порядком появления ключевых карт.
      - Роли, назначенные картами, влекут реальные насильственные последствия; текст описывает преступную практику, а не безопасную салонную игру.
    distinctive_features:
      - Две определённые карты не задают выигрышную комбинацию, а назначают разные роли в преступном ритуале клуба.
      - Председатель выступает раздающим и организатором, но исключён из жеребьёвки.
    completeness: partial
