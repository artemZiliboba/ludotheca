    observed_play:
      - Додо размечает приблизительно круговую трассу; участников располагают в разных местах вдоль неё.
      - Участники начинают и прекращают бег в выбранные ими моменты, без общего стартового сигнала; после примерно получаса Додо объявляет состязание завершённым.
      - После вопроса о победителе Додо объявляет победителями всех и требует выдать всем призы; Алиса раздаёт сладости, а сама получает напёрсток.
    explicit_rules:
      - Додо прямо поясняет, что точная форма трассы не имеет значения.
      - Додо объявляет, что победили все и все должны получить призы.
    mechanics:
      - Разнесённые по круговой трассе стартовые позиции.
      - Отсутствие синхронного старта и единого момента остановки участников.
      - Объявление общего результата и распределение призов между всеми участниками.
    completeness: partial
