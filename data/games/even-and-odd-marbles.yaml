      location_ru: 'Объяснение Дюпена после ухода префекта: пример школьника, играющего в «чёт или нечёт»'
      edition: 'Edgar Allan Poe Society of Baltimore, text of the 1845 Tales edition (Text-03b); checked against complete text reproduced by SparkNotes'
    observed_play:
      - Дюпен рассказывает о школьнике, выигрывавшем шарики у других детей благодаря оценке того, как думает соперник.
      - В первом примере мальчик ошибается, называя нечётное количество, а во втором раунде предсказывает, что противник изменит чётность, и угадывает.
      - Во втором примере мальчик ожидает, что более изощрённый противник предугадает простую смену чётности и оставит прежний вариант; мальчик снова угадывает.
      - Школьник объясняет свой метод попыткой мысленно поставить себя на место другого человека и воспроизвести его выражение лица.
    explicit_rules:
      - Один участник прячет в руке некоторое количество шариков; другой должен определить, чётно оно или нечётно.
      - При верном ответе угадывающий выигрывает один шарик, при неверном теряет один.
    mechanics:
      - Закрытая информация о количестве предметов и двоичный выбор ответа.
      - Передача одного шарика по результату раунда, позволяющая играть последовательность раундов.
      - Прогноз следующего выбора по предыдущим действиям и предполагаемой глубине рассуждений соперника.
    distinctive_features:
      - Рассказ описывает не только правила, но и многоуровневое психологическое предсказание: участник оценивает, предугадает ли противник его собственный прогноз.
      - Мимическое подражание противнику приведено как приём конкретного школьника, а не обязательная часть правил.
    completeness: partial
