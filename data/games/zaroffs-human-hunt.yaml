    observed_play:
      - Генерал Зарофф объясняет Рейнсфорду, что устраивает охоту на людей и считает её игрой.
      - Рейнсфорд получает одежду, еду и нож, уходит в джунгли и запутывает след, чтобы избежать преследования.
      - Преследуемый устраивает несколько ловушек; Зарофф продолжает охоту, в том числе с собаками.
      - Рейнсфорд возвращается в дом Зароффа; генерал объявляет, что тот выиграл игру, после чего противостояние продолжается.
    explicit_rules:
      - Преследуемому предоставляют еду, охотничий нож и три часа форы.
      - Зарофф говорит, что преследует человека с пистолетом малого калибра и небольшой дальности.
      - Если преследуемый избегает обнаружения три полных дня, он выигрывает; если Зарофф находит его, он проигрывает.
      - В случае победы Рейнсфорда генерал обещает доставить его на материк; обещание сопровождается требованием молчать об острове, которое Рейнсфорд не принимает.
    mechanics:
      - Асимметричные роли преследователя и преследуемого с заранее установленной форой.
      - Ограничение времени выживания и явные условия выигрыша и проигрыша.
      - Маскировка следов, поиск по следам и ловушки показаны в конкретной охоте, но не объявлены обязательными правилами.
    distinctive_features:
      - Зарофф объявляет человеческую охоту игрой; отказ сопровождается угрозой насилия со стороны Ивана, поэтому участие не является свободным.
      - Преследуемый использует нож и припасы, а преследователь имеет огнестрельное оружие и позднее привлекает собак.
    completeness: partial
