    observed_play:
      - В начале книги приведены шахматная доска, распределение персонажей по белым и красным фигурам и запись партии с победой белой пешки Алисы за одиннадцать ходов.
      - Красная Королева предлагает Алисе занять место белой пешки Лили и объясняет, что, добравшись с второй до восьмой горизонтали, та станет королевой.
      - Алиса путешествует по местности, разбитой на шахматные клетки; перемещения через ручьи соотносятся с продвижением по доске.
      - Красный и Белый Рыцари появляются как противники; Белый Рыцарь защищает Алису, а затем она достигает восьмой горизонтали и становится королевой.
      - В записи партии последний ход Алисы обозначен как взятие Красной Королевы и победа; это часть авторской шахматной задачи, а не общее правило шахмат.
    explicit_rules:
      - Красная Королева прямо говорит Алисе, что та начинает на второй горизонтали и станет королевой, если достигнет восьмой.
      - В предварительной шахматной задаче сказано, что белая пешка Алиса должна сыграть и выиграть за одиннадцать ходов.
    mechanics:
      - Сюжет оформлен как шахматная партия с персонажами в ролях фигур и размеченным на клетки миром.
      - Продвижение пешки к последней горизонтали приводит к превращению в королеву; этот мотив основан на обычном шахматном превращении.
      - Запись партии сопоставляет отдельные события путешествия с ходами фигур, не превращая каждый эпизод в самостоятельное правило.
    distinctive_features:
      - Шахматная доска превращена в географию мира, а живые персонажи исполняют роли фигур.
      - В отличие от обычной настольной партии, путешествие пешки описано как последовательность встреч и событий; порядок ходов в художественной записи не всегда следует обычному чередованию сторон.
      - Финальная авторская запись о взятии Красной Королевы и победе не должна толковаться как допустимое универсальное условие победы в шахматах.
