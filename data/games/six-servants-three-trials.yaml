    observed_play:
      - Королева обещает выдать дочь за претендента, если тот выполнит все три задания; предыдущих неудачливых женихов казнили.
      - Для первого задания королевич должен достать кольцо, упавшее в Красное море. Слуга с острым зрением находит его, толстяк выпивает море, а длинный слуга поднимает кольцо; королева признаёт успех.
      - Во втором задании требуется съесть 300 волов целиком и выпить 300 бочек вина без остатка. Королева разрешает одного гостя, и королевич приглашает толстяка, который всё съедает и выпивает.
      - В третьем задании королевич должен удерживать принцессу в объятиях до полуночи и не засыпать. Колдовство усыпляет присутствующих, принцессу уносят на скалу, но слуги возвращают её до полуночи.
      - После выполнения трёх заданий принцесса отдельно требует, чтобы кто-нибудь выдержал огонь в сложенном ею костре. Слуга, которому холодно в огне, выдерживает его три дня, и условие выполняется.
    explicit_rules:
      - Для получения руки принцессы королева требует успешного выполнения трёх последовательно предъявляемых заданий; неудачливому жениху угрожает смерть.
      - Второе задание требует полного уничтожения 300 волов и 300 бочек вина без остатка; разрешён только один приглашённый гость.
      - В третьем задании к удару полуночи принцесса должна оставаться в объятиях королевича; королева также предостерегает его от сна.
    mechanics:
      - Последовательные задания с конкретными проверяемыми условиями успешного выполнения.
      - Применение разных способностей помощников для решения задач; участие помощников показано в сюжете, но универсальное право пользоваться ими не формулируется.
      - Во втором задании действует ограничение на число гостей; в третьем — временной предел до полуночи.
      - Испытание огнём добавлено принцессой после трёх первоначальных задач и не является частью объявленной королевой тройки.
    completeness: partial
