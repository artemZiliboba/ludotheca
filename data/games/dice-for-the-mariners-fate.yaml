    observed_play:
      - На приблизившемся корабле-призраке две фигуры, Смерть и Жизнь-в-Смерти, бросают кости.
      - Жизнь-в-Смерти объявляет, что игра завершена и она победила; затем корабль-призрак удаляется.
      - После этого спутники старого морехода умирают, а сам он остаётся жив; связь этих событий с выигрышем отражена в повествовании, но условия игры не объяснены.
    mechanics:
      - Состязание двух участников с бросанием костей и объявлением победителя.
      - Сверхъестественный исход игры связан в повествовании с судьбой людей на корабле; конкретные выигрышные комбинации и порядок бросков не описаны.
    distinctive_features:
      - Вместо обычного материального выигрыша на кону, по смыслу сцены, судьба старого морехода и его спутников.
