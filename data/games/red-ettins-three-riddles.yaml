      edition: 'Joseph Jacobs, English Fairy Tales (1890), as transcribed at Wikisource; Jacobs explicitly substituted riddles from Demandes Joyous'
    observed_play:
      - Красный Эттин обнаруживает старшего брата и предлагает ему ответить на три вопроса, обещая сохранить жизнь при успехе.
      - Каждая из трёх голов задаёт старшему брату по одной загадке; он не отвечает ни на одну, и великан превращает его в каменный столб.
      - Позднее великан задаёт младшему брату те же три вопроса. Тот заранее получил ответы от доброй феи и отвечает на все три.
      - После успешных ответов великан понимает, что его власть закончилась; младший брат затем убивает его и освобождает пленников.
    explicit_rules:
      - Великан прямо обещает сохранить жизнь пленнику, если тот сумеет ответить на три его вопроса.
    mechanics:
      - Три последовательно задаваемые загадки, по одной от каждой головы великана.
      - Успех показан как правильные ответы на все три вопроса; старший брат терпит неудачу, младший справляется.
      - Ответы, полученные заранее от феи, помогают младшему брату; запрет на подсказки в тексте не установлен.
    completeness: partial
